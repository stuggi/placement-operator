ServerTokens Prod
ServerSignature Off
TraceEnable Off
PidFile run/httpd.pid
ServerRoot "/etc/httpd"
ServerName "localhost.localdomain"

User apache
Group apache

Listen 8778

TypesConfig /etc/mime.types

Include conf.modules.d/*.conf
# TODO: remove /etc/httpd/conf.d/00-placement-api.conf from image, so we can not just conf.d/* before
# this is removed e.g. https://github.com/openstack-k8s-operators/tcib/pull/111
Include conf.d/ssl.conf
#Include conf.d/*.conf

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy

SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
ErrorLog /dev/stderr
TransferLog /dev/stdout
CustomLog /dev/stdout combined env=!forwarded
CustomLog /dev/stdout proxy env=forwarded

{{ range $endpt, $vhost := .VHosts }}
# {{ $endpt }} vhost {{ $vhost.ServerName }} configuration
<VirtualHost *:8778>
  <IfVersion >= 2.4>
    ErrorLogFormat "%M"
  </IfVersion>
  ServerName {{ $vhost.ServerName }}

  ## Vhost docroot
  DocumentRoot "/var/www/cgi-bin/placement"

  ## Directories, there should at least be a declaration for /var/www/cgi-bin/placement
   <Directory "/var/www/cgi-bin/placement">
      Options -Indexes +FollowSymLinks +MultiViews
      AllowOverride None
      Require all granted
   </Directory>

  ## Logging
  ErrorLog /dev/stdout
  SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
  CustomLog /dev/stdout combined env=!forwarded
  CustomLog /dev/stdout proxy env=forwarded
  ServerSignature Off
  CustomLog /dev/stdout combined

{{- if $vhost.TLS }}
  SetEnvIf X-Forwarded-Proto https HTTPS=1

  ## SSL directives
  SSLEngine on
  SSLCertificateFile      "{{ $vhost.SSLCertificateFile }}"
  SSLCertificateKeyFile   "{{ $vhost.SSLCertificateKeyFile }}"
{{- end }}

  ## WSGI configuration
  WSGIApplicationGroup %{GLOBAL}
  WSGIDaemonProcess {{ $endpt }} display-name={{ $endpt }} processes=3 threads=1 user=placement group=placement
  WSGIProcessGroup {{ $endpt }}
  WSGIScriptAlias / "/usr/bin/placement-api"
  WSGIPassAuthorization On
</VirtualHost>
{{ end }}

